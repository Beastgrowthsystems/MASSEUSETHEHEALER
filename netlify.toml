[build]
  command = "bun run build"
  publish = "dist"

[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/wp/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/blog/wp-includes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

